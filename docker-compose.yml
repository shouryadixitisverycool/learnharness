# Self-hosted LearnHarness. Put secrets in .env.server (copy .env.server.example).
# Everything you create — chats, knowledge graph, practice sets, settings,
# provider keys — lives in the learnharness-data volume on this machine.
services:
  learnharness:
    build: .
    image: learnharness:latest
    restart: unless-stopped
    env_file: .env.server
    ports:
      # Loopback only: reach it through tailscale serve or a reverse proxy.
      # The login lockout trusts the proxy's X-Forwarded-For hop, so the
      # port must not be reachable directly from other machines.
      - "127.0.0.1:3000:3000"
    # One person's server: two cores and 2 GB leave room for the rest of
    # the machine (Chromium for demos runs inside this limit too).
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - learnharness-data:/data
    shm_size: "512mb" # headless Chromium

volumes:
  learnharness-data:
